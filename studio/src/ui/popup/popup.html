<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ratatosk Studio</title>
    <style>
      :root { color-scheme: light; --bg:#fbfcfb; --surface:#f1f5f3; --line:#dce5e1; --fg:#24332d; --muted:#60716a; --green:#28745b; --red:#a5402c; }
      * { box-sizing:border-box } body { width:380px; margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      h1 { margin:0; font-size:17px } .sub { margin:3px 0 16px; color:var(--muted); font-size:12px } .card { border:1px solid var(--line); border-radius:12px; padding:14px; background:white; }
      ul { margin:8px 0 12px; padding-left:20px; color:var(--muted); font-size:12px } label { display:flex; gap:9px; align-items:flex-start; font-size:12px; color:var(--fg); margin:12px 0; }
      button { width:100%; border:0; border-radius:9px; padding:10px 12px; color:white; background:var(--green); font:600 13px/1 inherit; cursor:pointer; } button:disabled { opacity:.45; cursor:not-allowed } button.secondary { color:var(--fg); background:var(--surface); margin-top:8px; }
      .live { display:flex; gap:8px; align-items:center; margin-bottom:12px; color:var(--muted); } .dot { width:8px; height:8px; border-radius:50%; background:var(--red); } .result { display:grid; gap:10px; }
      pre { max-height:220px; overflow:auto; white-space:pre-wrap; word-break:break-word; margin:0; padding:10px; border-radius:8px; background:var(--surface); font:10.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
      .notice { color:var(--muted); font-size:11px; margin-top:10px } #error { color:var(--red); font-size:12px; margin-top:8px; }
      @media (prefers-reduced-motion: reduce) { * { transition:none!important } }
    </style>
  </head>
  <body>
    <h1>Ratatosk Studio</h1>
    <div class="sub">Development-only recipe authoring</div>
    <main id="app"></main>
    <div id="error" role="alert"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
