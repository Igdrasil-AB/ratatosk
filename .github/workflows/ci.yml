name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push to the same PR has nothing left to prove.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Enforce architecture boundaries
        run: npm run check:boundaries
      - name: Validate recipes (schema + test coverage)
        run: npm run validate
      - name: Validate release metadata
        run: npm run validate:release
      - name: Test
        run: npm test
      - name: Build Collector
        run: npm run build:collector
      - name: Package public Collector
        run: npm run package:collector
