name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Enforce architecture boundaries
        run: npm run check:boundaries
      - name: Validate recipes (schema + test coverage)
        run: npm run validate
      - name: Validate release metadata (allow only explicit unverified pilot baseline)
        run: npm run validate:release -- --allow-unverified-pilot-baseline
      - name: Test
        run: npm test
      - name: Build Collector and Studio independently
        run: npm run build
      - name: Package public Collector
        run: npm run package:collector
