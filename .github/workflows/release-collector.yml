name: Release Collector

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0
        with:
          # Build and package scripts must not inherit a repository-write
          # credential; GH_TOKEN is exposed only to the publish step below.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Require the tag to match the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run release:collector
      - name: Verify and publish the reviewed Collector artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-collector-release.sh
