name: Release Collector

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build and package scripts must not inherit a repository-write
          # credential; GH_TOKEN is exposed only to the publish step below.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Single source of truth, and an exact entry in the CI test matrix, so
          # a release never builds on a runtime no test job exercised.
          node-version-file: .nvmrc
          cache: npm
      - name: Require the tag to match the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run release:collector
      - name: Verify the exact artifact the tag claims
        run: npm run verify:collector-artifact
      - name: Publish the reviewed Collector artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-collector-release.sh
