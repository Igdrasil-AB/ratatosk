name: Release Studio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.0
        with:
          # Build and package scripts must not inherit a repository-write
          # credential; GH_TOKEN is exposed only to the publish step below.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Require the tag to match the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run release:studio
      - name: Verify and publish the reviewed Studio artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-studio-release.sh
