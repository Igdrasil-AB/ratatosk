version: 2
updates:
  # Collector holds a session token and optional host access; Studio separately
  # holds debugger access. Both packages therefore need close dependency review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
